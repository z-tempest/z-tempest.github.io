---
layout: default
---
<main style="margin-top: 40px">
  <div class="wrapper">
    {%- if page.title %}
    <header class="post-header">
      <h1>{{ page.title | escape }}</h1>
    </header>
    {%- endif %}
    <div class="blog-block">
      <div class="post-content">
        {{ content }}
      </div>
    </div>
  </div>
</main>
