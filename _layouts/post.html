---
layout: default
---

<main class="page-content" aria-label="Content">
  <div class="post-wrapper">
    <article
      class="post h-entry"
      itemscope
      itemtype="http://schema.org/BlogPosting"
    >
      <header class="post-header">
        <h1 class="post-title p-name" itemprop="name headline">
          {{ page.title | escape }}
        </h1>
        <p class="post-meta">
          <time
            class="dt-published"
            datetime="{{ page.date | date_to_xmlschema }}"
            itemprop="datePublished"
            >{{ page.date | date: "%b %-d, %Y" }}</time
          >
        </p>
        <p class="post-topics">{{ page.topics }}</p>
        <div class="post-repository">
          <svg class="svg-icon" style="width: 18px">
            <use
              xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"
            ></use>
          </svg>
          <a href="{{ page.repository }}">{{ page.repository }}</a>
        </div>
      </header>
      <div class="blog-block">
        <div class="post-content e-content" itemprop="articleBody">
          {{ content }}
        </div>
      </div>
      <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
    </article>
  </div>
</main>

<script>
  document
    .querySelectorAll(".image-card[data-rotate]")
    .forEach(function (card) {
      var imgs = card.querySelectorAll(".image-card__img");
      var i = 0;
      setInterval(function () {
        imgs[i].classList.remove("is-active");
        i = (i + 1) % imgs.length;
        imgs[i].classList.add("is-active");
      }, 3000);
    });
</script>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [
        ["$", "$"],
        ["\\(", "\\)"],
      ],
      displayMath: [
        ["$$", "$$"],
        ["\\[", "\\]"],
      ],
    },
  };
</script>
<script
  defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
></script>
