---
layout: default
---

<main class="page-content" aria-label="Content">
  <div class="wrapper">
    <article class="post flex-box">
      <header class="post-header">
        <h1>{{ page.heading | default: page.title | escape }}</h1>
      </header>
      <div class="profile">
        <img
          src="{{ '/assets/zepheazy.png' | relative_url }}"
          class="portrait"
        />
        <div class="profile-icons">
          {%- if site.github_username %}
          <a
            href="https://github.com/{{ site.github_username }}"
            aria-label="GitHub"
          >
            <svg class="svg-icon" viewBox="0 0 16 16">
              <use
                xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"
              ></use>
            </svg>
          </a>
          {%- endif %} {%- if site.twitter_username %}
          <a
            href="https://www.twitter.com/{{ site.twitter_username }}"
            aria-label="X"
          >
            <svg class="svg-icon" viewBox="0 0 16 16">
              <use
                xlink:href="{{ '/assets/minima-social-icons.svg#twitter' | relative_url }}"
              ></use>
            </svg>
          </a>
          {%- endif %} {%- if site.linkedin_username %}
          <a
            href="https://www.linkedin.com/in/{{ site.linkedin_username }}"
            aria-label="LinkedIn"
          >
            <svg class="svg-icon" viewBox="0 0 16 16">
              <use
                xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"
              ></use>
            </svg>
          </a>
          {%- endif %}
        </div>
      </div>
      <div class="blog-block">
        <div class="post-content">{{ content }}</div>
      </div>
    </article>
  </div>
</main>
